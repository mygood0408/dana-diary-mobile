<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dan-A life story</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap');
:root{
  --bg:#fdf5ea; --card:#fffaf3; --border:#f0ddc2; --text:#4a3a2c; --muted:#9c8672;
  --accent:#ff9d6c; --accent-dark:#e87f4e;
  --pink:#ffd6c9; --yellow:#ffe9a8; --yellow-dark:#dcae3c;
  --blue:#cfe8f3; --blue-dark:#5b9ab8;
  --input-bg:#fffaf3; --input-border:#f0ddc2;
  --radius:18px; --radius-sm:12px; --shadow:0 4px 16px rgba(190,140,90,.14);
  --green-bg:#e3f5e1; --green-border:#a9d9a4; --green-text:#2f6b34;
  --yellow-bg:#fff3d6; --yellow-border:#e8c56b; --yellow-text:#8a6110;
  --red-bg:#fbe3e0; --red-border:#e8a99f; --red-text:#a13d2e;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Gowun Dodum',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 60px}
.appHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 10px;flex-wrap:wrap}
.titleRow{display:flex;align-items:center;gap:10px}
.appIcon{width:38px;height:38px;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(190,140,90,.25))}
.headerActions{display:flex;align-items:center;gap:6px}
.headerActions #loginBtn{padding:8px 12px;font-size:12.5px}
.appIcon svg{width:100%;height:100%;display:block}
h1{font-family:'Jua',sans-serif;font-weight:400;font-size:21px;margin:0;color:var(--accent-dark)}
.appSub{font-size:12.5px;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h2{font-family:'Jua',sans-serif;font-weight:400;font-size:15.5px;margin:0 0 10px;color:var(--text)}
.small{font-size:12.5px;color:var(--muted)}
label{display:block;font-size:13px;margin:8px 0 4px;color:var(--muted)}
input,select{width:100%;padding:10px;border:1.5px solid var(--input-border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text);font-size:14px}
button{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:10px 15px;cursor:pointer;font-weight:700}
button:hover{background:var(--accent-dark)}
button.secondary{background:var(--yellow);color:#7a5410;font-weight:700}
button.secondary:hover{background:var(--yellow-dark);color:#fff}
button:disabled{opacity:.5}
.statusBox{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;border:1.5px solid transparent}
.statusBox.st-none{background:var(--yellow-bg);border-color:var(--yellow-border);color:var(--yellow-text)}
.statusBox.st-ok{background:var(--green-bg);border-color:var(--green-border);color:var(--green-text)}
.statusBox.st-err{background:var(--red-bg);border-color:var(--red-border);color:var(--red-text)}
.summaryRow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.postItem{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.postItem:last-child{border-bottom:none}
.postThumb{width:60px;height:60px;border-radius:var(--radius-sm);object-fit:cover;background:var(--input-bg);flex:none}
.postThumb.novid{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--muted)}
.postMeta{min-width:0}
.postTitle{font-family:'Jua',sans-serif;font-weight:400;font-size:14.5px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--accent-dark)}
.postDate{font-size:12px;color:var(--muted)}
.postSnippet{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.place-badge{display:inline-block;background:var(--blue);color:var(--blue-dark);border-radius:999px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.placeChecks{max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;margin-top:6px}
.placeChecks label{display:flex;align-items:flex-start;text-align:left;direction:ltr;gap:8px;font-size:13px;margin:0;padding:7px 4px;border-bottom:1px solid var(--border)}
.placeChecks label:last-child{border-bottom:none}
.placeChecks input[type=checkbox]{flex:none;margin:2px 0 0;width:16px;height:16px;accent-color:var(--accent)}
.placeChecks label span{flex:1;text-align:left}
.emptyMsg{text-align:center;color:var(--muted);font-size:13px;padding:30px 0}
/* ---- 상세보기 모달 ---- */
.modalOverlay{position:fixed;inset:0;background:rgba(74,58,44,.55);display:none;align-items:flex-end;z-index:100}
.modalOverlay.show{display:flex}
.modalSheet{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px;box-shadow:var(--shadow)}
.modalSheet h3{font-family:'Jua',sans-serif;font-weight:400;margin:2px 0 8px;font-size:17px;color:var(--accent-dark)}
.modalClose{float:right;background:var(--yellow);color:var(--text);font-size:18px;padding:4px 10px;border:none;border-radius:50%}
.mediaGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.mediaGrid img,.mediaGrid video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);background:var(--input-bg)}
.mediaGrid .vidBox{position:relative;width:100%;aspect-ratio:1;border-radius:var(--radius-sm);background:var(--input-bg);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.mediaGrid .vidBox img,.mediaGrid .vidBox video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.playIcon{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:rgba(74,58,44,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.bodyText{white-space:pre-wrap;font-size:14px;line-height:1.6;margin-top:10px}
.lightbox{position:fixed;inset:0;background:rgba(30,22,14,.88);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.lightbox.show{display:flex}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;border-radius:var(--radius-sm)}
.lightboxClose{position:absolute;top:16px;right:16px;background:rgba(255,255,255,.25);color:#fff;border:none;border-radius:50%;width:36px;height:36px;font-size:18px}
.scrollFab{position:fixed;right:16px;bottom:20px;display:none;flex-direction:column;gap:8px;z-index:50}
.scrollFab.show{display:flex}
.scrollFab button{width:46px;height:46px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:16px;box-shadow:0 2px 8px rgba(190,120,70,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="appHeader">
    <div class="titleRow">
      <div class="appIcon">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="20" r="9" fill="#cfe8f3"/>
          <path d="M6 46c0-9 5.4-15 12-15s12 6 12 15v4H6z" fill="#cfe8f3"/>
          <circle cx="46" cy="20" r="9" fill="#ffd6c9"/>
          <path d="M34 46c0-9 5.4-15 12-15s12 6 12 15v4H34z" fill="#ffd6c9"/>
          <circle cx="32" cy="30" r="7.5" fill="#ffe9a8"/>
          <path d="M22 52c0-7.5 4.5-12.5 10-12.5S42 44.5 42 52v3H22z" fill="#ffe9a8"/>
        </svg>
      </div>
      <h1>Dan-A life story</h1>
    </div>
    <div class="headerActions">
      <button id="loginBtn" type="button">구글 로그인</button>
    </div>
  </div>

  <div id="statusBox" class="statusBox st-none">
    <span id="statusText">아직 로그인하지 않았습니다.</span>
  </div>

  <div class="card" id="filterCard" style="display:none;">
    <h2>🔍 검색 · 필터</h2>
    <label>키워드 (쉼표로 여러 개 = AND)<input type="text" id="kwInput" placeholder="예: 발레, 생일"></label>
    <label>연월<select id="monthSelect"><option value="">전체</option></select></label>
    <div class="summaryRow" style="margin-top:8px;">
      <button id="placeToggleBtn" class="secondary" type="button">📍 다녀온 곳으로 필터</button>
      <span id="resultCount" class="small"></span>
    </div>
    <div id="placeChecks" class="placeChecks" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>🗂️ 게시물 목록</h2>
    <div id="postList"></div>
    <div id="emptyMsg" class="emptyMsg" style="display:none;">구글 로그인 후 게시물을 불러와주세요.</div>
  </div>
</div>

<div id="scrollFab" class="scrollFab">
  <button id="scrollTop" type="button">▲</button>
  <button id="scrollBottom" type="button">▼</button>
</div>

<div id="detailModal" class="modalOverlay">
  <div class="modalSheet">
    <button class="modalClose" id="detailClose" type="button">✕</button>
    <div id="detailBody"></div>
  </div>
</div>

<div id="lightbox" class="lightbox">
  <button class="lightboxClose" id="lightboxClose" type="button">✕</button>
  <div id="lightboxContent"></div>
</div>

<script>
/* =========================================================================
   구글드라이브 연결 + posts.json 로딩
   ========================================================================= */
/* ---------- 구글드라이브 연결 정보 (고정값) ----------
   이 값들은 비밀번호가 아닙니다 — 실제 접근 통제는 ①Google Drive 폴더 공유 설정
   (초대한 사람만 폴더를 볼 수 있음)과 ②OAuth 동의 화면의 "테스트 사용자" 목록
   (등록된 구글 계정만 로그인 가능)에서 걸립니다. 아래 세 값을 채워 넣으면 방문자는
   로그인 버튼만 누르면 됩니다. PC 통합본(🔑 API키 입력 탭)에서 쓴 것과 같은 값을
   그대로 넣어주세요. */
const HARDCODED_CLIENT_ID = '758485559947-o50q1lghunmjc605nikcoadpk33pad5e.apps.googleusercontent.com';
const HARDCODED_API_KEY = 'AIzaSyDfWHV4GnJ0773yWleYnHYJVrQvxDGaKWA';
const HARDCODED_FOLDER_ID = '1js1RQumzDN0D7tTzm8-O9g2dMAFAazY_';

let accessToken = null;
let allPosts = [];       // posts.json의 posts 배열 (test- 더미 제외)
let placeKeywordCounts = new Map();
let selectedPlaces = new Set();
const thumbCache = new Map(); // driveFileId -> objectURL (썸네일/이미지 blob 캐시)

const $ = id => document.getElementById(id);

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getCfg(){
  return {
    clientId: HARDCODED_CLIENT_ID,
    apiKey: HARDCODED_API_KEY,
    folderId: HARDCODED_FOLDER_ID,
  };
}

function setStatus(text, kind){
  $('statusBox').className = 'statusBox ' + (kind||'st-none');
  $('statusText').textContent = text;
}

$('loginBtn').addEventListener('click', ()=>{
  const cfg = getCfg();
  if(!cfg.clientId || !cfg.apiKey || !cfg.folderId){ alert('클라이언트 ID / API 키 / 폴더 ID를 먼저 모두 입력해주세요.'); return; }
  if(typeof google === 'undefined' || !google.accounts){ alert('구글 로그인 스크립트를 아직 불러오지 못했습니다. 잠시 후 다시 시도해주세요.'); return; }
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: cfg.clientId,
    scope: 'https://www.googleapis.com/auth/drive.readonly',
    callback: async (resp)=>{
      if(resp.error){ setStatus('로그인 실패: '+JSON.stringify(resp), 'st-err'); return; }
      accessToken = resp.access_token;
      setStatus('로그인 성공! 게시물을 불러오는 중...', 'st-ok');
      await loadPostsFromDrive();
    },
  });
  tokenClient.requestAccessToken();
});

async function driveFetchJson(url){
  const res = await fetch(url, { headers:{ Authorization:'Bearer '+accessToken } });
  const data = await res.json();
  if(data.error){
    if(res.status===401){ accessToken=null; throw new Error('AUTH_EXPIRED'); }
    throw new Error(data.error.message||'드라이브 오류');
  }
  return data;
}

/* driveFileId의 실제 파일 바이트를 인증된 요청으로 받아와 blob object URL로 변환(캐시) */
async function getDriveBlobUrl(fileId){
  if(thumbCache.has(fileId)) return thumbCache.get(fileId);
  const cfg = getCfg();
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${cfg.apiKey}`, {
    headers:{ Authorization:'Bearer '+accessToken }
  });
  if(!res.ok){
    if(res.status===401){ accessToken=null; throw new Error('AUTH_EXPIRED'); }
    throw new Error('파일을 불러오지 못했습니다 (HTTP '+res.status+')');
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  thumbCache.set(fileId, url);
  return url;
}

/* 영상 파일은 그 자체를 <img>로 보여줄 수 없으므로, 구글드라이브가 영상에도 자동으로
   만들어주는 정지화면 썸네일(thumbnailLink)을 따로 요청해서 보여준다. */
async function getDriveVideoThumbUrl(fileId){
  const cacheKey = 'vthumb:'+fileId;
  if(thumbCache.has(cacheKey)) return thumbCache.get(cacheKey);
  const cfg = getCfg();
  const meta = await driveFetchJson(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=thumbnailLink&key=${cfg.apiKey}`);
  if(!meta.thumbnailLink) throw new Error('썸네일이 아직 없습니다');
  const res = await fetch(meta.thumbnailLink, { headers:{ Authorization:'Bearer '+accessToken } });
  if(!res.ok){
    if(res.status===401){ accessToken=null; throw new Error('AUTH_EXPIRED'); }
    throw new Error('썸네일을 불러오지 못했습니다 (HTTP '+res.status+')');
  }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  thumbCache.set(cacheKey, url);
  return url;
}

async function loadPostsFromDrive(){
  try{
    const cfg = getCfg();
    const q = encodeURIComponent(`name='posts.json' and '${cfg.folderId}' in parents and trashed=false`);
    const listData = await driveFetchJson(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)&key=${cfg.apiKey}`);
    const fileId = listData.files && listData.files[0] && listData.files[0].id;
    if(!fileId){ setStatus('폴더 안에서 posts.json을 찾지 못했습니다. PC에서 한 번 저장/백필을 해서 posts.json이 올라가 있는지 확인해주세요.', 'st-err'); return; }

    const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${cfg.apiKey}`, {
      headers:{ Authorization:'Bearer '+accessToken }
    });
    if(!res.ok) throw new Error('posts.json을 불러오지 못했습니다 (HTTP '+res.status+')');
    const json = await res.json();
    const posts = Array.isArray(json.posts) ? json.posts : [];
    allPosts = posts.filter(p => !(p.sourceMeta && typeof p.sourceMeta.dedupeKey==='string' && p.sourceMeta.dedupeKey.startsWith('test-')));
    allPosts.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.updatedAt||'').localeCompare(a.updatedAt||''));

    setStatus(`✅ 연결됨 — 게시물 ${allPosts.length}건 불러옴`, 'st-ok');
    $('filterCard').style.display = '';
    rebuildMonthOptions();
    rebuildPlaceIndex();
    renderList();
  }catch(e){
    if(String(e.message).includes('AUTH_EXPIRED')){
      setStatus('로그인이 만료되었습니다. 다시 로그인해주세요.', 'st-err');
    } else {
      setStatus('불러오기 실패: '+e.message, 'st-err');
    }
  }
}

/* =========================================================================
   캡션 파싱 (PC 통합본의 검색 탭과 동일한 규칙)
   ========================================================================= */
function parseCaption(content){
  const lines = String(content||'').split(/\r?\n/);
  let title = '';
  let placesText = null;
  const remaining = [];
  for(let i=0;i<lines.length;i++){
    const line = lines[i];
    if(!title && i===0 && /\d+\s*년\s*\d+\s*월\s*\d+\s*주차/.test(line)){ title = line.trim(); continue; }
    if(placesText===null && /다녀온\s*곳/.test(line)){
      const m = /다녀온\s*곳\s*[:：]?\s*(.*)$/.exec(line);
      placesText = m ? m[1].trim() : '';
      continue;
    }
    remaining.push(line);
  }
  return { title, placesText: placesText || '', body: remaining.join('\n').trim() };
}
function extractYearMonth(content){
  const m = /(\d{2,4})\s*년\s*(\d{1,2})\s*월/.exec(String(content||''));
  if(!m) return null;
  let year = parseInt(m[1],10); if(year<100) year+=2000;
  const month = parseInt(m[2],10);
  if(!(month>=1 && month<=12)) return null;
  return { year, month };
}
function tokenizePlaces(placesText){
  if(!placesText || /^(없음|none|없다|\.|-)$/i.test(placesText.trim())) return [];
  return placesText.split(/[\s#]+/).map(t=>t.trim()).filter(Boolean);
}
function splitTerms(raw){ return String(raw||'').split(',').map(s=>s.trim().toLowerCase()).filter(Boolean); }

function rebuildMonthOptions(){
  const keys = new Set();
  for(const p of allPosts){
    const ym = extractYearMonth(p.content) || (p.date && /^\d{4}-\d{2}/.test(p.date) ? {year:+p.date.slice(0,4), month:+p.date.slice(5,7)} : null);
    if(ym) keys.add(ym.year*100+ym.month);
  }
  const sorted = Array.from(keys).sort((a,b)=>b-a);
  const sel = $('monthSelect');
  sel.innerHTML = '<option value="">전체</option>' + sorted.map(k=>{
    const y=Math.floor(k/100), m=k%100;
    return `<option value="${k}">${y}년 ${m}월</option>`;
  }).join('');
}

function rebuildPlaceIndex(){
  placeKeywordCounts = new Map();
  for(const p of allPosts){
    const {placesText} = parseCaption(p.content);
    for(const t of tokenizePlaces(placesText)){
      placeKeywordCounts.set(t, (placeKeywordCounts.get(t)||0)+1);
    }
  }
  const sorted = Array.from(placeKeywordCounts.entries()).sort((a,b)=>b[1]-a[1]);
  $('placeChecks').innerHTML = sorted.map(([t,c])=>`
    <label><input type="checkbox" data-place="${escapeHtml(t)}"><span>${escapeHtml(t)} (${c})</span></label>
  `).join('') || '<span class="small">다녀온 곳 정보가 없습니다.</span>';
  $('placeChecks').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      if(cb.checked) selectedPlaces.add(cb.dataset.place); else selectedPlaces.delete(cb.dataset.place);
      renderList();
    });
  });
}
$('placeToggleBtn').addEventListener('click', ()=>{
  const box = $('placeChecks');
  box.style.display = box.style.display==='none' ? '' : 'none';
});

/* =========================================================================
   목록 렌더링 + 필터
   ========================================================================= */
function firstPhotoMedia(media){
  if(!Array.isArray(media)) return null;
  const photo = media.find(m=>m.type==='photo' && m.driveFileId);
  if(photo) return photo;
  return media.find(m=>m.driveFileId) || null;
}

function matchesFilters(p){
  const {title, placesText, body} = parseCaption(p.content);
  const kw = splitTerms($('kwInput').value);
  if(kw.length){
    const hay = (title+' '+body+' '+placesText).toLowerCase();
    if(!kw.every(k=>hay.includes(k))) return false;
  }
  const monthVal = $('monthSelect').value;
  if(monthVal){
    const ym = extractYearMonth(p.content) || (p.date && /^\d{4}-\d{2}/.test(p.date) ? {year:+p.date.slice(0,4), month:+p.date.slice(5,7)} : null);
    if(!ym || (ym.year*100+ym.month) !== parseInt(monthVal,10)) return false;
  }
  if(selectedPlaces.size){
    const tokens = new Set(tokenizePlaces(placesText));
    let hit=false;
    for(const sp of selectedPlaces){ if(tokens.has(sp)){ hit=true; break; } }
    if(!hit) return false;
  }
  return true;
}

let listRenderToken = 0;
async function renderList(){
  const myToken = ++listRenderToken;
  const filtered = allPosts.filter(matchesFilters);
  $('resultCount').textContent = `${filtered.length}건`;
  const listEl = $('postList');
  $('emptyMsg').style.display = filtered.length ? 'none' : 'block';
  if(!filtered.length){ listEl.innerHTML=''; return; }

  listEl.innerHTML = filtered.map((p,i)=>{
    const {title, body} = parseCaption(p.content);
    const displayTitle = title || (p.title || body.slice(0,30) || '(제목 없음)');
    return `<div class="postItem" data-idx="${allPosts.indexOf(p)}">
      <div class="postThumb novid" id="thumb-${i}">📷</div>
      <div class="postMeta">
        <div class="postTitle">${escapeHtml(displayTitle)}</div>
        <div class="postDate">${escapeHtml(p.date||'')}</div>
        <div class="postSnippet">${escapeHtml(body.slice(0,40))}</div>
      </div>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.postItem').forEach(el=>{
    el.addEventListener('click', ()=> openDetail(allPosts[+el.dataset.idx]));
  });

  // 썸네일은 목록이 그려진 뒤 하나씩(동시 4개 제한) 채워넣는다
  const queue = filtered.map((p,i)=>({p,i}));
  let active = 0;
  function runNext(){
    if(myToken !== listRenderToken) return; // 그 사이 다른 검색으로 바뀌면 중단
    if(!queue.length) return;
    const {p,i} = queue.shift();
    active++;
    const m = firstPhotoMedia(p.media);
    const el = document.getElementById('thumb-'+i);
    (async ()=>{
      try{
        if(m && m.driveFileId){
          const url = await getDriveBlobUrl(m.driveFileId);
          if(el && myToken===listRenderToken){
            if(m.type==='video'){
              el.outerHTML = `<video class="postThumb" id="thumb-${i}" src="${url}" muted playsinline preload="metadata"></video>`;
            } else {
              el.outerHTML = `<img class="postThumb" id="thumb-${i}" src="${url}">`;
            }
          }
        }
      }catch(e){ /* 썸네일 실패는 무시하고 기본 아이콘 유지 */ }
      active--;
      runNext();
    })();
  }
  for(let k=0;k<4;k++) runNext();
}

$('kwInput').addEventListener('input', ()=> renderList());
$('monthSelect').addEventListener('change', ()=> renderList());

/* =========================================================================
   상세보기 (모달)
   ========================================================================= */
function openDetail(p){
  const {title, placesText, body} = parseCaption(p.content);
  const placeBadges = tokenizePlaces(placesText).map(t=>`<span class="place-badge">📍 ${escapeHtml(t)}</span>`).join('');
  const media = Array.isArray(p.media) ? p.media.filter(m=>m.driveFileId) : [];

  $('detailBody').innerHTML = `
    <h3>${escapeHtml(title || p.title || '(제목 없음)')}</h3>
    <div class="small">${escapeHtml(p.date||'')}</div>
    <div>${placeBadges}</div>
    <div class="mediaGrid" id="detailMediaGrid"></div>
    <div class="bodyText">${escapeHtml(body)}</div>
  `;
  $('detailModal').classList.add('show');
  pushModalState('detail');

  const grid = $('detailMediaGrid');
  media.forEach((m, idx)=>{
    const box = document.createElement('div');
    if(m.type==='video'){
      box.className='vidBox';
      box.innerHTML = `<span class="playIcon">▶</span>`;
      box.addEventListener('click', ()=> openLightboxVideo(m.driveFileId));
    } else {
      box.className='vidBox';
      box.addEventListener('click', ()=> openLightboxImage(m.driveFileId));
    }
    grid.appendChild(box);
    getDriveBlobUrl(m.driveFileId).then(url=>{
      if(m.type==='video'){
        const vid = document.createElement('video');
        vid.src = url; vid.muted = true; vid.playsInline = true; vid.preload = 'metadata';
        box.prepend(vid);
      } else {
        const img = document.createElement('img');
        img.src = url;
        box.prepend(img);
      }
    }).catch(()=>{ box.innerHTML += '<span class="small">미리보기 없음</span>'; });
  });
}
/* =========================================================================
   상세보기/확대보기를 열 때마다 브라우저 히스토리에 한 단계씩 쌓아서,
   폰의 물리적 "뒤로가기" 버튼을 눌러도 화면 전체가 초기화되지 않고
   열려있던 창만 한 단계씩 닫히게 한다.
   ========================================================================= */
const modalStack = []; // ['detail'] 또는 ['detail','lightbox']
function pushModalState(name){
  modalStack.push(name);
  history.pushState({diaryModal:name}, '');
}
function hideDetailModal(){ $('detailModal').classList.remove('show'); }
function hideLightbox(){ $('lightbox').classList.remove('show'); $('lightboxContent').innerHTML=''; }
window.addEventListener('popstate', ()=>{
  const top = modalStack.pop();
  if(top==='lightbox') hideLightbox();
  else if(top==='detail') hideDetailModal();
});
/* 닫기 버튼/배경 클릭 시에는 직접 닫지 않고 history.back()을 호출해서,
   popstate 핸들러가 처리하도록 한다 — 그래야 히스토리 스택과 항상 맞는다. */
function closeTopModal(){
  if(modalStack.length) history.back();
}
$('detailClose').addEventListener('click', closeTopModal);
$('detailModal').addEventListener('click', (e)=>{ if(e.target.id==='detailModal') closeTopModal(); });
$('lightboxClose').addEventListener('click', closeTopModal);
$('lightbox').addEventListener('click', (e)=>{ if(e.target.id==='lightbox') closeTopModal(); });

async function openLightboxImage(fileId){
  $('lightboxContent').innerHTML = '불러오는 중...';
  $('lightbox').classList.add('show');
  pushModalState('lightbox');
  try{
    const url = await getDriveBlobUrl(fileId);
    $('lightboxContent').innerHTML = `<img src="${url}">`;
  }catch(e){ $('lightboxContent').innerHTML = '불러오기 실패: '+escapeHtml(e.message); }
}
async function openLightboxVideo(fileId){
  $('lightboxContent').innerHTML = '영상을 불러오는 중... (용량에 따라 시간이 걸릴 수 있어요)';
  $('lightbox').classList.add('show');
  pushModalState('lightbox');
  try{
    const url = await getDriveBlobUrl(fileId);
    $('lightboxContent').innerHTML = `<video src="${url}" controls autoplay playsinline></video>`;
  }catch(e){ $('lightboxContent').innerHTML = '불러오기 실패: '+escapeHtml(e.message); }
}

/* ---------- 맨 위로 / 맨 아래로 ---------- */
(function(){
  const fab = $('scrollFab');
  window.addEventListener('scroll', ()=>{ fab.classList.toggle('show', window.scrollY>200 || document.body.scrollHeight>window.innerHeight*1.5); });
  $('scrollTop').addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));
  $('scrollBottom').addEventListener('click', ()=> window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'}));
})();
</script>
